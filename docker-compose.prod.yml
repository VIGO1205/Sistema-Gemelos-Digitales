version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: m6_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
      POSTGRES_DB: ${POSTGRES_DB:-m6_gemelo_digital}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - m6_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: m6_backend_prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}@db:5432/${POSTGRES_DB:-m6_gemelo_digital}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}@db:5432/${POSTGRES_DB:-m6_gemelo_digital}
      - CORS_ORIGINS=${CORS_ORIGINS:?Set CORS_ORIGINS to the Vercel frontend URL}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in the deployment environment}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      - DEMO_ACCOUNTS_ENABLED=false
      - DEBUG=False
      - ML_INFERENCE_URL=http://motor-inference:8502
    depends_on:
      db:
        condition: service_healthy
    networks:
      - m6_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: m6_frontend_prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - m6_network

  motor-inference:
    build:
      context: ./motor_ia_m6
      dockerfile: Dockerfile.serving
    container_name: m6_inference_prod
    restart: unless-stopped
    environment:
      - MOTOR_API_BASE_URL=http://backend:8000
    volumes:
      - ./motor_ia_m6/model_artifacts:/app/model_artifacts
    networks:
      - m6_network

volumes:
  postgres_prod_data:

networks:
  m6_network:
    driver: bridge
